[project]
name = "mychatbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vidhi Dixit", email = "vidhi2000dixit@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.143.0",
    "groq>=1.7.0",
    "openai>=3.26.0",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mychatbot = "mychatbot:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
